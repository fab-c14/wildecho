services:
  - type: web
    name: wildecho-explorer
    runtime: python
    buildCommand: pip install uv && uv sync --all-extras
    startCommand: uv run uvicorn wildecho.web.app:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WILDECHO_OFFLINE_MODE
        value: "true"
      - key: WILDECHO_GEMMA_MODEL
        value: "gemma-2-2b-it"
