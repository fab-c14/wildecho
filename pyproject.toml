[project]
name = "wildecho"
version = "0.1.0"
description = "WildEcho: Offline Backcountry Acoustic Nature Explorer & Eyes-Free Audio Field Guide"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Faisal Ahmad", email = "71762204+fab-c14@users.noreply.github.com" }
]
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pylint>=3.1.0",
]

[project.scripts]
wildecho = "wildecho.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildecho"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.11"
ignore = [".venv", "dist", "build"]
jobs = 0

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "x", "y", "ax", "f", "e", "t", "s", "w", "h", "fs"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "too-few-public-methods",
    "fixme",
    "invalid-name",
    "duplicate-code",
    "broad-exception-caught",
    "wrong-import-position",
    "wrong-import-order",
    "import-outside-toplevel",
    "redefined-outer-name",
    "global-statement",
    "disallowed-name",
    "superfluous-parens",
    "unused-argument",
    "trailing-whitespace",
    "consider-using-dict-items",
]

[tool.pylint.format]
max-line-length = 120
